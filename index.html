<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>3 Ons Dashboard · Demo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2733;--muted:#6b7785;--line:#e3e8ef;
  --brand:#1f4e79;--brand-ink:var(--brand);--teal:#1bb6c1;--accent:#ff6b35;--kpi:#0fb5d6;--hdr:62px;
  --amber:#e0912f;--red:#c0392b;--green:#2e9e5b;
  --navy:var(--brand);--blue:#2b6cad;
  --thbg:#eef3f9;--rowhov:#f2f8ff;--totbg:#f0f5fb;--selbg:#dcebfb;--chipbg:#e7f0fb;--chipbd:#bcd4ef;}
body.dark{--bg:#0f1720;--card:#1a2632;--ink:#e6ebf0;--line:#2b3a49;--brand:#6ea8dc;
  --muted:#a7b4c3;--kpi:#3fd0ec;--teal:#5fd3dd;
  --navy:var(--brand);--blue:#6ea8dc;
  --thbg:#22303d;--rowhov:#1e2b38;--totbg:#22303d;--selbg:#2a4358;--chipbg:#22303d;--chipbd:#33475c;}
body.dark{background:#0f1720}
body.dark{--brand-ink:#a9cff5;--muted:#b6c4d3;--navy:#a9cff5;--blue:#8fbdea}
body.dark #appHeader .hdrtitle{color:#dceafb}
body.dark .card .v{color:#dceafb}
body.dark .filters .reset,body.dark .chip.clear{color:#0f1720}
body.dark #access-denied p{color:var(--muted)}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope','Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
html{scrollbar-gutter:stable}
#appHeader{display:flex;align-items:center;gap:13px;padding:14px 22px 12px;
  border-bottom:2px solid var(--brand);flex-wrap:wrap;background:var(--bg)}
#appHeader .hdrlogo{width:40px;height:40px;border-radius:8px;background:#eef2f7;padding:3px;flex:none}
#appHeader .hdrtitle{font-size:23px;font-weight:800;color:var(--brand-ink);letter-spacing:-.015em;line-height:1.15}
#appHeader .sub{font-size:12px;color:var(--muted);margin-top:2px}
#appHeader .hdrsp{flex:1 1 auto}
#appHeader .hdracts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
body.dark #appHeader{border-bottom-color:#2e6bb0}
body.dark #appHeader .hdrlogo{background:#22303d}
#healthBar{padding:12px 22px 0}
.warnchip{font-size:12.5px;font-weight:600;line-height:1.55;padding:10px 14px;border-radius:8px;
  color:#7a4c07;background:#fdf3e0;border:1px solid #f0c987;border-left:4px solid #e0912f}
.warnchip.ok{color:#1d6b45;background:#e8f6ee;border-color:#a8d8bd;border-left-color:#2e9e5b}
body.dark .warnchip{color:#f2c98a;background:#2c2114;border-color:#5a4420;border-left-color:#d9a254}
body.dark .warnchip.ok{color:#8fe0b3;background:#13251c;border-color:#2a5540;border-left-color:#3ecf8e}
.warnchip b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  margin-bottom:3px;opacity:.9}
#lastRef{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:var(--muted);background:var(--card);border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;white-space:nowrap;line-height:1.4}
#lastRef .dot{width:8px;height:8px;border-radius:50%;background:#2e9e5b;flex:none}
#lastRef.stale .dot{background:#e0912f}
#lastRef.local{color:#7a4c07;background:#fdf3e0;border-color:#f0c987}
#lastRef.local .dot{background:#e0912f}
body.dark #lastRef.local{color:#f2c98a;background:#2c2114;border-color:#5a4420}
#lastRef b{font-weight:800;color:var(--ink)}
body.dark #lastRef.local b{color:#f2c98a}
.railbtn{background:var(--card);color:var(--brand-ink);border:1px solid var(--line);border-radius:9px;
  padding:7px 13px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .14s,border-color .14s}
.railbtn:hover{background:#eef2f7;border-color:#9db4d0}
body.dark .railbtn{background:#22303d;color:var(--ink);border-color:var(--line)}
body.dark .railbtn:hover{background:#28394a}
.layout{display:block}
#topSticky{position:sticky;top:0;z-index:100;background:var(--bg);padding:9px 22px 7px;
  box-shadow:0 6px 10px -8px rgba(0,0,0,.18)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:0;font-family:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;
  cursor:pointer;background:transparent;color:#5b6b7d;transition:background .14s,color .14s}
.tabs button:hover{background:#eef2f7;color:var(--brand-ink)}
.tabs button.tabslice{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(31,78,121,.28)}
body.dark .tabs button.tabslice{background:var(--brand);color:#0f1720;box-shadow:0 3px 12px rgba(110,168,220,.30)}
body.dark .tabs button{color:#a8b7c7}
body.dark .tabs button:hover{background:#22303d;color:#cfe0f0}
main{display:block;padding:10px 22px 20px}
.tabhead{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-bottom:4px;min-height:30px}
.tabhead .filters{margin:0 0 0 auto}
.howto{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:8px 11px;align-items:center;margin-bottom:4px;
  background:none;border:0;border-radius:0;padding:0;box-shadow:none}
.filters>div{display:flex;align-items:center;gap:6px}
.filters label{font-size:10px;color:var(--muted);display:inline;margin:0;text-transform:uppercase;letter-spacing:.4px;font-weight:700;white-space:nowrap}
.filters select{min-width:104px;padding:3px 6px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-family:inherit;background:var(--card);color:var(--ink)}
.filters select.weeksel{min-width:186px}
.filters input[type=date]{min-width:150px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)}
body.dark .filters input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.75);cursor:pointer}
.filters .reset{align-self:center;margin-left:auto;background:var(--brand);color:#fff;border:none;border-radius:7px;padding:4px 11px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.ms{position:relative}
.msbtn{min-width:62px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:left;padding:3px 20px 3px 7px;border:1px solid var(--line);border-radius:7px;
  font-size:12px;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;position:relative}
.msbtn::after{content:"\25BE";position:absolute;right:7px;top:50%;transform:translateY(-50%);opacity:.7}
.mspanel{position:absolute;z-index:200;top:calc(100% + 4px);left:0;min-width:196px;max-height:280px;overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px;
  box-shadow:0 12px 26px rgba(0,0,0,.25)}
.mspanel[hidden]{display:none}
.filters .msopt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:12.5px;
  color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;margin:0;cursor:pointer}
.filters .msopt:hover{background:var(--rowhov)}
.msopt input{margin:0;cursor:pointer;accent-color:var(--brand)}
.grid.cards.frontcards{display:flex;flex-wrap:wrap;gap:10px;margin:0;grid-template-columns:none;flex:1 1 auto}
.grid.cards.frontcards .card{padding:7px 17px;border-radius:10px;box-shadow:none;white-space:nowrap;
  min-width:190px;flex:1 1 0}
.grid.cards.frontcards .card .k{font-size:9.5px;letter-spacing:.35px}
.grid.cards.frontcards .card .v{font-size:21px;margin-top:1px;line-height:1.2}
.grid.cards.frontcards .card .v.money{font-size:17px}
@media(max-width:820px){.grid.cards.frontcards .card{min-width:0;flex:1 1 140px}}
.filters .msopt.mscombo{border-bottom:1px solid var(--line);
  border-radius:0;margin-bottom:4px;padding-bottom:6px}
.msact{display:flex;flex-wrap:wrap;gap:5px;padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:5px}
.msact button{flex:1 1 auto;font-family:inherit;font-size:10.5px;font-weight:700;padding:5px 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--card);color:var(--brand-ink);cursor:pointer;white-space:nowrap}
.msact button:hover{background:var(--rowhov)}
.chartlegend{display:flex;flex-direction:column;gap:2px;margin-top:9px}
.lgitem{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink);text-align:left;line-height:1.35;
  transition:opacity .13s}
.lgitem .sw{width:10px;height:10px;border-radius:50%;flex:none}
.lgitem.dim{opacity:.42}
.lgitem:hover .tx{text-decoration:underline}
.chartlegend.inline{flex-direction:row;flex-wrap:wrap;column-gap:14px;row-gap:1px;align-items:center}
.chartlegend.inline .lgitem{padding:1px 0}
.lgitem.lit{opacity:1}
.lgitem.lit .tx{text-decoration:underline;font-weight:700}
#chips{margin-bottom:6px}
.chips{margin-bottom:0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips.live{animation:kitFade .34s cubic-bezier(.22,.61,.24,1)}
.chips.idle{visibility:hidden;pointer-events:none}
@keyframes kitFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fadein{animation:kitFade .5s cubic-bezier(.22,.61,.24,1)}
@keyframes coetile{0%{opacity:0;transform:translateY(10px) scale(.995)}60%{opacity:1}100%{opacity:1;transform:none}}
.tfade{animation:coetile .62s cubic-bezier(.22,.61,.24,1)}
@keyframes coespin{to{transform:rotate(360deg)}}
#refIcon{display:inline-block}
#refIcon.spin{animation:coespin .8s linear infinite;transform-origin:50% 50%}
.chip{background:var(--chipbg);border:1.5px solid var(--chipbd);color:var(--navy);border-radius:18px;padding:5px 12px;cursor:pointer;font-size:11.5px;font-weight:600;transition:all .13s;line-height:1.35}
.chip:hover{border-color:#9db4d0}
.chip b{color:var(--red);margin-left:5px}
.chip.clear{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 1px 5px rgba(31,78,121,.28)}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);text-align:center}
.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.card .v{font-size:26px;font-weight:800;color:var(--brand-ink);margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .sub{font-size:11px;color:var(--muted);margin-top:3px}
.card .sub.resigned{color:#c0392b;font-weight:700}
.card .sub.referred{color:#1d7a45;font-weight:700}
body.dark .card .sub.resigned{color:#f2836f}
body.dark .card .sub.referred{color:#5fd39a}
.card .v.pct{color:var(--kpi)} .card .v.money{font-size:20px}
.panels{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.panels.cols-1{grid-template-columns:1fr}
.panels.cols-2{grid-template-columns:repeat(2,1fr)}
.panels.cols-3{grid-template-columns:repeat(3,1fr)}
.panels.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1500px){.panels.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1200px){.panels.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.panels.cols-2,.panels.cols-3,.panels.cols-4{grid-template-columns:1fr}}
.dualcol{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.dualcol>.colgrp{display:flex;flex-direction:column;gap:14px;min-width:0}
.dualcol>.colgrp+.colgrp{border-left:1px solid var(--line);padding-left:20px}
.colhd{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;
  color:var(--brand-ink);letter-spacing:-.01em}
.colhd::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.colgrp .cards{margin-bottom:0;grid-template-columns:1fr 1fr}
.colgrp .cards.compact .card{padding:6px 12px}
.colgrp .cards.compact .card .k{font-size:9.5px;letter-spacing:.35px}
.colgrp .cards.compact .card .v{font-size:19px;margin-top:1px;line-height:1.2}
.colgrp .pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1140px){.colgrp .pairgrid{grid-template-columns:1fr}}
#body.fitpage .dualcol{gap:12px}
#body.fitpage .dualcol>.colgrp+.colgrp{padding-left:12px}
#body.fitpage .pairgrid .panel{padding-left:10px;padding-right:10px}
@media(max-width:1000px){
  .dualcol{grid-template-columns:1fr}
  .dualcol>.colgrp+.colgrp{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px}
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.panel h3{margin:0 0 10px;font-size:12px;color:var(--brand-ink);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.panel .cw{position:relative;height:330px}
#body.spread .panel{display:flex;flex-direction:column}
#body.spread .panel .cw{height:auto;flex:1 1 auto;min-height:330px}
#body.spread .panel.full{display:block}          
.panel.tall .cw{height:390px}
#body.fitpage .cw{height:clamp(300px, calc(100svh - var(--fitchrome, 560px)), 620px);overflow:hidden}
#body.fitpage .chartlegend{height:var(--fitlegend,127px);overflow:hidden;align-content:start;gap:0}
#body.fitpage .lgitem{height:var(--fitlgrow,19.5px);padding:0;font-size:var(--fitlgfont,11.5px)}
#body.fitpage .lgitem .sw{width:9px;height:9px}
table.pivot{width:100%;border-collapse:collapse;font-size:12px}
table.pivot th,table.pivot td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
table.pivot th{background:var(--thbg);color:var(--brand-ink);position:sticky;top:0;z-index:1;text-transform:uppercase;letter-spacing:.03em;font-size:11px}
table.pivot td.num,table.pivot th.num{text-align:right;font-variant-numeric:tabular-nums}
table.pivot tbody tr{cursor:pointer}
table.pivot tbody tr:hover{background:var(--rowhov)}
table.pivot tr.tot td{font-weight:800;background:var(--totbg);cursor:default}
table.pivot tr.sel{background:var(--selbg)}
table.matrix tr.team{background:var(--totbg);font-weight:700}
table.matrix tr.team .tw{display:inline-block;width:14px;color:var(--blue)}
table.matrix tr.child td.co{padding-left:28px;font-weight:400;color:var(--muted)}
table.matrix tr.child{font-weight:400}
table.matrix.qf th.grp{border-left:1px solid var(--line);text-align:center}
table.matrix.qf td.fee,table.matrix.qf th.fee{color:#2e7d46;border-right:1px solid var(--line)}
body.dark table.matrix.qf td.fee,body.dark table.matrix.qf th.fee{color:#74d6a1}
.panels.resign3 table.matrix.qf td.fee,.panels.resign3 table.matrix.qf th.fee{color:#b3600f}
body.dark .panels.resign3 table.matrix.qf td.fee,body.dark .panels.resign3 table.matrix.qf th.fee{color:#f0a63c}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.panels.resign3{grid-template-columns:1.28fr 1.28fr minmax(345px,.44fr);align-items:start}
.panels.resign3 .scroll{max-height:min(1100px, 135vh)}
@media(max-width:1180px){
  .panels.resign3{grid-template-columns:1fr 1fr}
  .panels.resign3>*:nth-child(3){grid-column:1/-1}
}
@media(max-width:900px){
  .panels.resign3{grid-template-columns:1fr}
  .panels.resign3>*:nth-child(3){grid-column:auto}
}
.panels.resign3 table.pivot th,.panels.resign3 table.pivot td{padding:4px 4px}
.panels.resign3 table.matrix.qf td.num,.panels.resign3 table.matrix.qf th.num{padding-left:3px;padding-right:3px}
table.matrix.wrapco td.co{white-space:normal;min-width:250px;max-width:none;line-height:1.32}
table.matrix.wrapco thead th:first-child{white-space:normal}
table.matrix.wrapco thead th.grp{white-space:normal}
.full{grid-column:1/-1}
.hint{font-size:11px;color:var(--muted);margin-top:6px}
.panel h3.withbtn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.expbtn{background:var(--card);color:var(--brand-ink);border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;text-transform:none;
  letter-spacing:0;white-space:nowrap}
.expbtn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);z-index:50}
.err{color:var(--red);padding:20px}
#cardbar .card,#cardbarAud .card,#cardbarTax .card{animation:coetile .62s cubic-bezier(.22,.61,.24,1)}
@media(prefers-reduced-motion:reduce){
  .fadein,.tfade,#cardbar .card,#cardbarAud .card,#cardbarTax .card{animation:none}
  #refIcon.spin{animation:none}
}
</style>

<style>
.demopill{margin-left:12px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#7a4b00;background:#fff4dc;border:1px solid #efcf8f;white-space:nowrap;align-self:center}
body.dark .demopill{color:#ffd88a;background:#3a2c10;border-color:#6b5320}
@media (max-width:640px){.demopill{margin-left:8px;font-size:10px;padding:2px 7px}}

<body>
<div id="loading">Loading 3 Ons data…</div>
<header id="appHeader">
  <img src="logo.svg" alt="Contoso Advisory Group" class="hdrlogo"/>
  <div style="display:flex;align-items:center;min-width:0"><div class="hdrtitle">3 Ons Dashboard</div><span class="demopill" title="Every company, person and figure on this page is invented">Demo · made-up data</span></div>
  <div class="hdrsp"></div>
  <div class="hdracts">
    <div id="lastRef" title="When the engine last rebuilt this data, and where the page read it from"><span class="dot"></span>Last refreshed: <b>&mdash;</b></div>
    <button class="railbtn" id="refreshBtn" onclick="doRefresh()" title="Re-read the source files and rebuild the data"><span id="refIcon">&#8635;</span> Refresh</button>
    <button class="railbtn" id="themeBtn" onclick="toggleTheme()" title="Switch between light and dark">&#9789; Dark</button>
    <button class="railbtn" id="signout" onclick="fullSignOut()" style="display:none">Sign out</button>
  </div>
</header>
<div id="access-denied" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:60;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Segoe UI',system-ui,Arial">
  <div style="font-size:40px;color:var(--red);margin-bottom:12px">&#128274;</div>
  <h2 style="margin:0 0 8px;color:var(--navy)">Access Restricted</h2>
  <p style="margin:0 0 8px;color:#4b5563">Signed in as <code id="ad-email">&mdash;</code>.</p>
  <p id="ad-reason" style="margin:0 0 14px;color:var(--red);font-size:13px;max-width:540px"></p>
  <a href="javascript:void(0)" onclick="fullSignOut()" style="background:var(--blue);color:#fff;text-decoration:none;border-radius:6px;padding:10px 20px;font-weight:600;font-size:14px">Sign out and try a different account</a>
</div>
<div id="healthBar"><div class="warnchip" id="healthChip" style="display:none"></div></div>
<div class="layout">
  <div id="topSticky"><div class="tabs" id="nav"></div></div>
